name: CI

# Compile + run tests on every push and every pull request, across the
# three supported targets:
#
#   x86_64-unknown-linux-gnu      — ubuntu-latest
#   x86_64-pc-windows-msvc        — windows-latest
#   aarch64-apple-darwin          — macos-14 (Apple Silicon runners)
#
# Intel macOS (`x86_64-apple-darwin`) is intentionally NOT supported.
# The only macOS-specific code path that warrants a dedicated build
# is Metal-accelerated inference via Ollama; that requires an Apple
# GPU and Intel Macs don't have one. README + docs spell this out
# under "supported targets."
#
# Default Cargo features (plaintext SQLite) are used so the matrix
# builds cleanly without needing Strawberry Perl on Windows. The
# production SQLCipher path is exercised by the release pipeline,
# not the per-push CI.
#
# Docker-dependent integration tests (`runner_e2e_docker.rs`) are
# opt-in via `EXECLAW_E2E_DOCKER=1` and stay off in this workflow —
# GitHub-hosted runners don't have a usable Docker daemon on macOS or
# Windows.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel any in-flight run for the same ref when a fresh push lands —
# saves CI minutes during rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # CI builds against the latest Rust stable. The README documents MSRV
  # 1.85+ for the project's stated edition-2024 floor, but transitive
  # dependencies routinely require a newer toolchain than the floor —
  # tracking stable matches what most contributors install via rustup.
  # If we ever need MSRV-floor verification, add a separate
  # `msrv` job pinning `dtolnay/rust-toolchain@1.85`.

jobs:
  rust:
    name: rust / ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy, rustfmt

      # Native system libraries needed by transitive deps:
      #   * `libfontconfig1-dev` + `libfreetype6-dev` — pulled in by
      #     `plotters`'s `ttf` feature via `font-kit` →
      #     `yeslogic-fontconfig-sys` + `freetype-sys`. The
      #     `execlaw-charting` crate (used by the native
      #     `chart.render` built-in) needs these to render PNG charts
      #     with proper antialiased text. macOS uses Core Text and
      #     Windows uses DirectWrite — both have no system-dep
      #     requirement, so this step is Linux-only.
      #   * `pkg-config` is already on the GitHub-hosted ubuntu-latest
      #     image but listed for explicitness — `*-sys` crates
      #     resolve their system libs through it.
      - name: Install Linux system deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libfontconfig1-dev \
            libfreetype6-dev

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo clippy --workspace
        # `-D warnings` would break on existing warnings the workspace
        # already carries (mcp_http_client dead_code, voice-pipeline
        # unused_assignments). Tighten this to `-D warnings` once those
        # are scrubbed; for now we treat clippy as advisory.
        run: cargo clippy --workspace --all-targets

      - name: cargo test --workspace
        # `--no-fail-fast` keeps the run going past the first failure so
        # the report shows everything broken, not just the first.
        run: cargo test --workspace --locked --no-fail-fast

  spa:
    name: spa
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        run: npm ci

      - name: typecheck
        run: npm run lint

      - name: vitest
        run: npm test

      - name: build
        run: npm run build

      - name: bundle-size budget
        run: npm run size

  # cargo-deny: license compatibility, advisory database scan,
  # version-ban policy. Runs on Linux only — the four sub-checks
  # (advisories / bans / licenses / sources) are platform-independent
  # so duplicating across the matrix is wasted CI minutes.
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: cargo-deny

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          # The four sub-commands map directly to the [advisories],
          # [licenses], [bans], [sources] tables in `deny.toml` at
          # the repo root.
          command: check advisories bans licenses sources

  # Semgrep static-analysis pass for security-sensitive patterns.
  # Currently advisory (continue-on-error: true) — findings surface
  # in CI logs but don't block merges. Tighten to required once the
  # ruleset stabilizes and the false-positive rate drops.
  #
  # Today's rules (.semgrep/rust-sql-format.yml):
  #   * rust-sql-format-interpolation — flags `format!` whose first
  #     argument contains a SQL verb AND a `{}` placeholder. Audit
  #     2026-05 recommended this as a regression guardrail.
  #   * rust-rusqlite-format-arg — flags `format!` values passed into
  #     rusqlite's execute / query / prepare methods.
  #
  # To silence a finding the reviewer has confirmed is safe, add a
  # `// nosemgrep: <rule-id>` comment with a one-line reason on the
  # line above the offending call.
  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6

      - name: Install Semgrep
        run: pip install --user semgrep

      - name: Run SQL-format guardrail
        run: semgrep --config .semgrep/rust-sql-format.yml --error crates/

  # Code-coverage job is currently disabled — re-enable when we wire
  # up a CODECOV_TOKEN or otherwise restore the lcov upload pipeline.
  # The previous job ran cargo-llvm-cov over the workspace and pushed
  # `lcov.info` to Codecov; the README badge depends on that upload.
