name: Bug report
description: Report a defect in execlaw
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing. Before continuing, please confirm:
        - **Security issues**: do **not** open a public issue. See [SECURITY.md](../SECURITY.md).
        - **Plugin authoring questions**: see [`docs/plugins.md`](../../docs/plugins.md) first.

  - type: input
    id: version
    attributes:
      label: execlaw version
      description: |
        Output of `cargo run -p execlaw -- --version`, OR the
        commit SHA from `git rev-parse HEAD`.
      placeholder: e.g. 1469407 or v0.1.0
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux x86_64
        - macOS x86_64 (Intel)
        - macOS arm64 (Apple Silicon)
        - Windows 10/11 x86_64
        - Other (please describe in steps below)
    validations:
      required: true

  - type: input
    id: rust
    attributes:
      label: Rust version
      description: Output of `rustc --version`.
      placeholder: e.g. rustc 1.95.0
    validations:
      required: true

  - type: textarea
    id: plugins
    attributes:
      label: Installed plugins
      description: |
        Output of `curl -s http://127.0.0.1:3031/api/admin/plugins | jq`,
        or just a list of plugin IDs + versions.
      render: text
    validations:
      required: false

  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: |
        The minimum sequence that reliably surfaces the bug.
        Code blocks welcome.
      placeholder: |
        1. Send a WhatsApp message to the bot
        2. Observe ...
        3. Expected ... but got ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log excerpt
      description: |
        From `~/.execlaw/logs/execlaw.jsonl.<date>` or the running
        `execlaw service status` log surface. Trim to the lines
        immediately around the failure. **Redact tokens / secrets
        before pasting.**
      render: text
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Anything else that might help diagnose.
    validations:
      required: false
