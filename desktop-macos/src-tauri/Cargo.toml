[package]
name = "execlaw-tray"
version = "0.1.0"
description = "execlaw macOS menu bar app — registers the LaunchAgent via SMAppService and hosts the WebView."
authors = ["Justin Long <justinelgenlong@gmail.com>"]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/justinelgenlong/execlaw"
rust-version = "1.85"

# This crate is intentionally OUTSIDE the workspace at the repo root —
# see the `exclude` entry in `/Cargo.toml`. Tauri pulls in macOS-only
# Apple framework bindings (objc2, wry, tao) that wouldn't compile on
# a Windows or Linux dev host, so keeping it out of the workspace lets
# `cargo check -p execlaw-*` stay fast on all OSes.

[lib]
name = "execlaw_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "execlaw-tray"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri 2 — tray-icon ships in core but is feature-gated; image-png
# decodes the tray icon at runtime.
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
# Loopback-only — server lives on 127.0.0.1:3031. rustls-tls is
# included so a future change to https on loopback (e.g. for the
# voice WebRTC path) doesn't force a feature bump.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# macOS-only — SMAppService bindings via raw objc2 message sends.
# Linking the ServiceManagement framework happens in build.rs so
# the resulting binary advertises the dependency to the linker
# (otherwise `+[SMAppService …]` would resolve at runtime to a nil
# class and silently return errors).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString", "NSError", "NSURL"] }
objc2-app-kit = { version = "0.2", features = ["NSApplication", "NSWorkspace", "NSRunningApplication"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
