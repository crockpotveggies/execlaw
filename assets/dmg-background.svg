<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  DMG installer background.
  Coordinates must match bundle.macOS.dmg in tauri.conf.json:
    windowSize                  : 660 x 400
    appPosition                 : (180, 170)
    applicationFolderPosition   : (480, 170)
  Icons are 80x80, so each spans ±40 from the centre point.
  Render via sips, see scripts/build-mac.sh step 4.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="660" height="400"
     viewBox="0 0 660 400">
  <defs>
    <!-- Subtle top→bottom gradient so the icons sit on a soft ground
         rather than a flat slab. Stays neutral so it works against
         both light + dark Finder chrome. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#f7f7f8"/>
      <stop offset="1"    stop-color="#e6e7ea"/>
    </linearGradient>
    <!-- Arrow head — reused by the connector path -->
    <marker id="arrowhead"
            viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7"
            orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a8d93"/>
    </marker>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>

  <!-- Title -->
  <text x="330" y="64"
        text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600"
        fill="#1d1d1f">
    Install execlaw
  </text>

  <!-- Subtitle / instruction -->
  <text x="330" y="92"
        text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400"
        fill="#4b4b50">
    Drag the app into your Applications folder.
  </text>

  <!-- Connector arrow from the right edge of the app icon
       (180 + 40 = 220) to the left edge of the Applications
       slot (480 − 40 = 440), at the icon vertical centre y=170. -->
  <line x1="240" y1="170" x2="420" y2="170"
        stroke="#8a8d93" stroke-width="2"
        stroke-linecap="round"
        marker-end="url(#arrowhead)"/>

  <!-- Footer hint -->
  <text x="330" y="350"
        text-anchor="middle"
        font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="11" font-weight="400"
        fill="#7a7d84">
    First launch: right-click execlaw → Open to bypass Gatekeeper.
  </text>
</svg>
