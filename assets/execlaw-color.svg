<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Colorful app icon. Approximates the green automatic-gradient + glass
  treatment specified in assets/execlaw-apple-icon.icon/icon.json,
  since Apple Icon Composer's .icon package requires icon-tool/actool
  from full Xcode 26 to compile (Command Line Tools doesn't ship it).
  Base green = extended-srgb 0.20392,0.78039,0.34902 (#34C759, Apple
  system green). Silhouette mirrors assets/execlaw.svg.
-->
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024"
     viewBox="0 0 1024 1024">
  <defs>
    <!-- Vertical gradient: brighter at top, base green at bottom.
         Mimics Apple's auto-gradient depth fall-off. -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#7EE49A"/>
      <stop offset="0.45" stop-color="#4CD274"/>
      <stop offset="1"   stop-color="#2BB44E"/>
    </linearGradient>
    <!-- Subtle inner highlight along the top edge, faded down. -->
    <linearGradient id="topglow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="0.25" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5"  stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Soft neutral shadow under the silhouette
         (icon.json: shadow.kind=neutral, opacity 0.5). -->
    <filter id="dropshadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="10" result="off"/>
      <feComponentTransfer in="off" result="shade">
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shade"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- macOS-style squircle (rounded rect approximation). The
         "continuous" radius Apple uses is closer to a superellipse;
         225px corner on a 1024 icon is the conventional fallback. -->
    <clipPath id="squircle">
      <rect x="0" y="0" width="1024" height="1024" rx="225" ry="225"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <!-- Base gradient -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#bg)"/>
    <!-- Top specular highlight -->
    <rect x="0" y="0" width="1024" height="1024" fill="url(#topglow)"/>

    <!-- Silhouette (from assets/execlaw.svg path, native viewBox
         1254x1254). The path's actual bounding box is
         x=[280.3, 1033.1], y=[222.5, 978.2] (width=753, height=756,
         centre=(656.7, 600.3)) — bottom-right of the parent viewBox.
         Apply transform="translate(tx,ty) scale(s)" so the path's
         centre lands at (512, 512) and the silhouette fills ~85% of
         the 1024 icon (≈870 px). scale = 870/753 ≈ 1.156. Then
         tx = 512 - 1.156·656.7 ≈ -247.1, ty = 512 - 1.156·600.3 ≈
         -181.9. -->
    <g transform="translate(-247.1, -181.9) scale(1.156)" filter="url(#dropshadow)">
      <path fill="#ffffff"
            d="m 654.15557,975.88339 c -38.88731,-8.46697 -68.44901,-38.61953 -102.94573,-56.92215 -32.49091,-24.96176 -77.36552,-37.20328 -101.56163,-70.94735 -5.68076,-31.92277 20.16397,-59.61023 34.40601,-86.31057 18.23629,-31.60889 57.05504,-61.28168 94.5227,-43.33332 33.00314,14.5489 61.97447,54.11906 101.87893,38.96376 35.09898,-15.10221 65.67858,-56.09129 108.05236,-40.97961 40.91001,16.35199 60.53646,60.40367 79.58094,97.20202 24.23432,36.22277 -18.02399,60.74167 -45.144,74.89116 -46.26156,27.52673 -90.26734,59.30025 -138.00272,84.05777 -9.90737,2.59313 -20.50639,5.652 -30.78686,3.37829 z m -290,-184.69708 c -23.62607,-21.7223 -32.45073,-56.71081 -43.2739,-86.49509 -40.53572,-128.57979 4.48805,-276.92121 106.89777,-363.85884 104.95089,-96.23256 271.0206,-118.34118 396.19401,-49.34125 129.0904,66.96607 209.13815,217.75556 187.52145,362.30502 -6.1483,47.26262 -22.71535,93.17983 -47.83049,133.62639 -32.48229,9.34943 -14.78793,-49.99715 -30.83962,-68.78839 -10.11855,-34.51325 -37.1563,-58.81949 -61.42363,-83.46046 -22.86972,-32.68484 -6.88528,-75.51731 -20.96525,-111.40497 -25.15487,-98.03949 -134.1298,-165.60464 -233.0275,-139.44942 -86.40582,19.0432 -151.14463,101.54579 -152.01106,189.50444 3.11626,32.19608 -8.33193,65.19195 -35.8964,83.70425 -35.99289,32.02096 -49.2266,81.00689 -53.29136,127.3193 -1.86051,4.68904 -7.3054,6.97853 -12.05402,6.33902 z m 279.5,-91.43156 c -66.42845,-8.76517 -115.89555,-78.66217 -100.68539,-144.29273 11.11596,-69.61313 90.16755,-116.82716 156.72805,-92.64361 73.17109,21.45853 106.26577,117.63314 65.07339,180.71597 -24.51852,41.12465 -74.0613,63.09685 -121.11605,56.22037 z m 74.23874,-147.01053 c 47.70688,-26.59709 -27.14173,-79.76534 -38.24866,-29.23118 -5.16587,21.56539 18.8456,39.35316 38.24866,29.23118 z"/>
    </g>
  </g>
</svg>
