[package]
name = "execlaw-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Axum HTTP + WebSocket server. Auth, admin API, WS event stream."

[dependencies]
execlaw-core = { path = "../core" }
execlaw-vault = { path = "../vault" }
execlaw-policy = { path = "../policy" }
execlaw-plugin-sdk = { path = "../plugin-sdk" }
execlaw-inference-api = { path = "../inference-api" }
execlaw-runner-local = { path = "../runner-local" }
execlaw-plugin-host = { path = "../plugin-host" }
execlaw-container-manager = { path = "../container-manager" }
execlaw-mcp-client = { path = "../mcp-client" }
futures.workspace = true
tempfile.workspace = true

axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core", "pkcs8", "pem"] }
rand.workspace = true
hex.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
async-trait.workspace = true
dashmap.workspace = true
rusqlite.workspace = true

utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true

# Phase 7e: WebAuthn second-factor for the controller login. Optional
# feature because the underlying `webauthn-rs` pulls in `openssl-sys`,
# which doesn't build out of the box on Windows-host dev (needs
# Strawberry Perl + libssl headers). Linux + Docker builds enable
# `webauthn` so production gets the second factor; Windows dev runs
# with `default-no-webauthn` and the routes return 503 unconfigured.
webauthn-rs = { workspace = true, optional = true }
webauthn-rs-proto = { workspace = true, optional = true }
openssl-sys = { version = "0.9", features = ["vendored"], optional = true }

[features]
default = []
# Compile-in the WebAuthn relying-party + routes + login second-factor
# branch. OFF by default because `webauthn-rs` pulls in `openssl-sys`,
# which fails to build on a stock Windows-host dev environment without
# Strawberry Perl + libssl headers. The production Docker image enables
# the feature explicitly (`--features webauthn`) and CI runs the test
# suite both with and without it. When the feature is off, every
# webauthn route returns 503 `webauthn_unconfigured` and the login
# route never demands a second factor (because registration is
# impossible).
webauthn = ["dep:webauthn-rs", "dep:webauthn-rs-proto", "dep:openssl-sys"]

[dev-dependencies]
tempfile.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
criterion.workspace = true
zip = { workspace = true }
execlaw-plugin-sdk = { path = "../plugin-sdk" }
# Phase 12.B/C — supervisor tests use the in-memory mock controller
# that the container-manager crate exposes behind the test-mock
# feature.
execlaw-container-manager = { path = "../container-manager", features = ["test-mock"] }

[[bench]]
name = "server_hot_paths"
harness = false
