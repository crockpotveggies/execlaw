[package]
name = "execlaw-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Axum HTTP + WebSocket server. Auth, admin API, WS event stream."

[dependencies]
execlaw-core = { path = "../core" }
execlaw-vault = { path = "../vault" }
execlaw-policy = { path = "../policy" }
execlaw-plugin-sdk = { path = "../plugin-sdk" }
execlaw-inference-api = { path = "../inference-api" }
execlaw-runner-local = { path = "../runner-local" }
execlaw-plugin-host = { path = "../plugin-host" }
futures.workspace = true
tempfile.workspace = true

axum = { workspace = true, features = ["ws"] }
tower.workspace = true
tower-http.workspace = true
hyper.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
serde.workspace = true
serde_json.workspace = true
jsonwebtoken.workspace = true
ed25519-dalek = { workspace = true, features = ["rand_core", "pkcs8", "pem"] }
rand.workspace = true
hex.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
uuid.workspace = true
async-trait.workspace = true
dashmap.workspace = true
rusqlite.workspace = true

utoipa.workspace = true
utoipa-axum.workspace = true
utoipa-swagger-ui.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }
criterion.workspace = true
zip = { workspace = true }
execlaw-plugin-sdk = { path = "../plugin-sdk" }

[[bench]]
name = "server_hot_paths"
harness = false
