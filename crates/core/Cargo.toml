[package]
name = "execlaw-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Event log, conversation FSM, turn commit, work queue. The durability heart of execlaw."

[features]
# Default is plaintext SQLite — for local-dev `cargo check/test` on hosts
# that can't build OpenSSL (notably Windows without Strawberry Perl).
#
# Production release builds *must* enable `sqlcipher` so operator state
# at rest is encrypted. The release pipeline passes
# `--no-default-features -F sqlcipher` when building the per-OS binary,
# and the binary self-reports its feature set in `execlaw doctor` so
# operators can confirm they're running an encrypted build.
default = ["bundled-sqlite-plain"]
bundled-sqlite-plain = ["rusqlite/bundled"]
# Encrypted DB: SQLCipher + bundled, vendored OpenSSL. One binary, one
# encrypted file, no system deps. Enabled by the production image build.
sqlcipher = ["rusqlite/bundled-sqlcipher-vendored-openssl"]

[dependencies]
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
rmp-serde.workspace = true
rusqlite.workspace = true
r2d2.workspace = true
r2d2_sqlite.workspace = true
tracing.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
cron.workspace = true
uuid.workspace = true
hex.workspace = true
sha2.workspace = true
hmac.workspace = true
schemars.workspace = true
# 2026-05-17 — utoipa derives let core types (AutomationDef, NodeDef,
# BusEventKind, AutomationRunStatus, ...) self-describe in the
# server's OpenAPI spec at `/api/openapi.json`. Derive-only usage,
# no runtime cost; the macro expands to a static schema function the
# server's `ApiDoc` collects.
utoipa.workspace = true
# 2026-05-15 — needed by the chart.render built-in tool. The
# charting crate is pure Rust (plotters) so it builds in core
# without pulling in any heavy native deps.
execlaw-charting = { path = "../charting" }

[dev-dependencies]
tempfile.workspace = true
pretty_assertions.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
criterion.workspace = true

[[bench]]
name = "core_hot_paths"
harness = false
