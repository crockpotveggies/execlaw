[package]
name = "plugin-google-contacts"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Google People API identity provider plugin for execlaw."
publish = false

[[bin]]
name = "google-contacts"
path = "src/main.rs"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync"] }
reqwest = { workspace = true, default-features = false, features = ["json", "rustls-tls"] }
