[plugin]
id = "google-calendar"
name = "Google Calendar"
version = "0.3.0"
description = "Google Calendar API tools — list calendars/events, check availability, get/create/update/delete events. Mutations send notifications when attendees are present."
author = "execlaw"
license = "Apache-2.0"

[[oauth_accounts]]
name = "controller"
provider = "google"
# `calendar.events` is required for create/update/delete; readonly
# wouldn't be enough. Operators on the v0.1 release with only
# `calendar.readonly` granted will see write tools fail with a
# scope error from Google — re-running the connect flow re-prompts
# with the expanded scope set.
scopes = [
    "https://www.googleapis.com/auth/calendar.readonly",
    "https://www.googleapis.com/auth/calendar.events",
    "openid",
    "email",
]
proactive_refresh_window = "10m"
warn_before_expiry = ["7d", "3d", "1d"]

[[tools]]
name = "calendar.list_calendars"
description = "List the operator's Google calendars (id, summary, time zone, primary flag)."
latency = "medium"

[[tools]]
name = "calendar.list_events"
description = "List events on a calendar within a time window. Args: { calendar_id?: string (default 'primary'), time_min?: RFC3339, time_max?: RFC3339, max_results?: integer (default 25, cap 100), query?: string }."
latency = "medium"

[[tools]]
name = "calendar.check_availability"
description = "Free/busy lookup across one or more calendars. Args: { time_min: RFC3339, time_max: RFC3339, calendar_ids?: string[] (default ['primary']) }. Returns the freeBusy response keyed by calendar id."
latency = "medium"

[[tools]]
name = "calendar.get_event"
description = "Get the full event payload by id. Args: { calendar_id?: string (default 'primary'), event_id: string }."
latency = "medium"

[[tools]]
name = "calendar.create_event"
description = """Create a new calendar event. Args: { calendar_id?: string \
(default 'primary'), summary: string, start: RFC3339, end: RFC3339, \
description?: string, location?: string, attendees?: string[] (emails) }. \
`start` and `end` MUST carry the operator's local UTC offset (e.g. \
`2026-05-05T18:00:00-07:00` for 6pm Pacific) — NEVER use a `Z` suffix \
unless the operator explicitly asked for UTC, since `Z` lands the event \
in UTC and renders shifted by the offset in the operator's calendar app. \
The per-turn context block lists the operator's timezone — use it. \
Sends invitations when attendees are present."""
latency = "medium"

[[tools]]
name = "calendar.update_event"
description = """Patch an existing event. Args: { calendar_id?: string \
(default 'primary'), event_id: string, summary?, start?, end?, description?, \
location?, attendees? }. Same RFC3339-with-local-offset rule as \
`create_event` applies to `start` / `end` — use the operator's local \
offset, never a `Z` suffix unless they explicitly want UTC. Sends update \
notifications when attendees are present."""
latency = "medium"

[[tools]]
name = "calendar.delete_event"
description = "Cancel an event. Args: { calendar_id?: string (default 'primary'), event_id: string }. Returns { deleted: true } on success."
latency = "medium"

[runtime]
tier = "script"
source = "main.rhai"
